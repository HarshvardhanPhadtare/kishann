# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

        
 
  health-monitor:
    name: Basic Health Monitoring
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    steps:
      - name: Check project health
        env:
          DEPLOY_STATUS: ${{ needs.deploy.result }}
        run: |
          echo "================================"
          echo "    KISANBAZAAR MONITORING"
          echo "================================"

          if [ "$DEPLOY_STATUS" = "success" ]; then
            echo "STATUS: HEALTHY"
            echo "Deployment completed successfully."
            echo "### HEALTHY - Deployment successful" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "STATUS: UNHEALTHY"
            echo "Deployment failed or was cancelled."
            echo "### UNHEALTHY - Deployment failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi


